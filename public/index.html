<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 상담 로봇</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>AI 상담 로봇</h1>
    </header>

    <main>
      <section>
        <h2>환영합니다!</h2>
        <p>무엇이든 상담을 가능한 AI 로봇입니다.</p>
      </section>

      <section aria-labelledby="chat-title">
        <h2 id="chat-title" class="visually-hidden">채팅</h2>

        <div id="chat-box" aria-live="polite" aria-atomic="false"></div>

        <div class="chat-controls">
          <input
            type="text"
            id="user-input"
            placeholder="메시지를 입력하세요..."
            aria-label="채팅 입력"
          />
          <div class="button-row">
            <button id="send-button" type="button">전송</button>
            <button id="login-button" type="button">로그인</button>
            <button id="signup-button" type="button">회원 가입</button>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <p>&copy; 2025 AI 상담 로봇</p>
    </footer>

    <!-- 로그인 모달 -->
    <div
      id="login-modal"
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="login-title"
      aria-hidden="true"
    >
      <div class="modal-content">
        <button class="close" id="close-login" aria-label="닫기">
          &times;
        </button>
        <h2 id="login-title">로그인</h2>
        <form id="login-form">
          <label for="login-username">사용자 이름:</label>
          <input type="text" id="login-username" required />
          <label for="login-password">비밀번호:</label>
          <input type="password" id="login-password" required />
          <button type="submit">로그인</button>
        </form>
      </div>
    </div>

    <!-- 회원 가입 모달 -->
    <div
      id="signup-modal"
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="signup-title"
      aria-hidden="true"
    >
      <div class="modal-content">
        <button class="close" id="close-signup" aria-label="닫기">
          &times;
        </button>
        <h2 id="signup-title">회원 가입</h2>

        <form id="signup-form">
          <label for="signup-username">사용자 이름:</label>
          <input type="text" id="signup-username" required />
          <label for="signup-userid">사용자 아이디:</label>
          <input type="text" id="signup-userid" required />
          <label for="signup-phone">사용자 번호:</label>
          <input
            type="text"
            id="signup-phone"
            required
            placeholder="010-xxxx-xxxx"
          />
          <label for="signup-password">비밀번호:</label>
          <input type="password" id="signup-password" required />
          <button type="submit">회원 가입</button>
        </form>

        <button id="quick-signup-button" type="button">간편 가입</button>

        <h3>간편 가입</h3>
        <div class="social-buttons">
          <button id="signup-naver" type="button">네이버 아이디로 가입</button>
          <button id="signup-kakao" type="button">
            카카오톡 아이디로 가입
          </button>
          <button id="signup-google" type="button">구글 아이디로 가입</button>
        </div>
      </div>
    </div>

    <script src="script.js" defer></script>
  </body>
</html>
